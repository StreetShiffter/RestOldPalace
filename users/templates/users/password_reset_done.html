{% extends "restic/base.html" %}
{% load static %}
{% block title %}Письмо отправлено{% endblock %}

{% block extra_css %}
<style>
  .message-container {
    max-width: 460px;
    margin: 3rem auto;
    padding: 0;
  }

  .message-card {
    background-color: #FABA53;
    padding: 2.25rem;
    border-radius: 18px;
    position: relative;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  }

  /* Внутренняя линия */
  .message-card::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    right: 5px;
    bottom: 5px;
    border: 3px solid #470068;
    border-radius: 15px;
    pointer-events: none;
  }

  .message-card h2 {
    text-align: center;
    color: #470068;
    font-family: 'Georgia', serif;
    font-weight: bold;
    font-size: 2rem;
    margin-bottom: 1.25rem;
    text-shadow: 0.5px 0 0 currentColor, -0.5px 0 0 currentColor;
  }

  .message-card p {
    color: #470068;
    font-size: 1.1rem;
    line-height: 1.6;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  /* Ссылка "Назад" */
  .message-card .back-link {
    display: block;
    text-align: center;
    color: #470068;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.05rem;
    margin-top: 0.5rem;
  }

  .message-card .back-link:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block content %}
<div class="message-container">
  <div class="message-card">
    <h2>Проверьте вашу почту</h2>
    <p>На указанный email было отправлено письмо с инструкциями по восстановлению пароля.</p>

    <a href="javascript:history.back()" class="back-link">← Вернуться назад</a>
  </div>
</div>
{% endblock %}
