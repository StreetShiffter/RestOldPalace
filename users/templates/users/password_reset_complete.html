{% extends "restic/base.html" %}
{% load static %}
{% block title %}Пароль успешно изменен{% endblock %}

{% block extra_css %}
<style>
  .complete-container {
    max-width: 460px;
    margin: 3rem auto;
    padding: 0;
  }

  .complete-card {
    background-color: #FABA53;
    padding: 2.25rem;
    border-radius: 18px;
    position: relative;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  }

  /* Внутренняя линия */
  .complete-card::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    right: 5px;
    bottom: 5px;
    border: 3px solid #470068;
    border-radius: 15px;
    pointer-events: none;
  }

  .complete-card h2 {
    text-align: center;
    color: #470068;
    font-family: 'Georgia', serif;
    font-weight: bold;
    font-size: 2rem;
    margin-bottom: 1.25rem;
    text-shadow: 0.5px 0 0 currentColor, -0.5px 0 0 currentColor;
  }

  .complete-card p {
    color: #470068;
    font-size: 1.1rem;
    line-height: 1.6;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  /* Кнопка "Войти" */
  .complete-card .btn-login {
    display: block;
    background-color: #470068;
    color: white;
    text-decoration: none;
    font-weight: bold;
    padding: 0.75rem;
    font-size: 1.2rem;
    border-radius: 10px;
    text-align: center;
    width: 100%;
    transition: background-color 0.3s;
    margin: 0 auto;
    text-align: center;
  }

  .complete-card .btn-login:hover {
    background-color: #35004d;
    color: white;
    text-decoration: none;
  }

  /* Ссылка как кнопка */
  .complete-card .btn-login {
    display: inline-block;
  }
</style>
{% endblock %}

{% block content %}
<div class="complete-container">
  <div class="complete-card">
    <h2>Пароль успешно изменен</h2>
    <p>Вы можете теперь войти в систему с новым паролем.</p>
    <a href="{% url 'users:login' %}" class="btn-login">Войти</a>
  </div>
</div>
{% endblock %}
