[project]
name = "restoldpalace"
version = "0.1.0"
description = ""
authors = [
    {name = "StreetShiffter",email = "agwzdushaz@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"  # ">=3.11,<4.0" - временно прописать для установки celery beat
dependencies = [
    "django (>=5.2.8,<6.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-filter (>=25.2,<26.0)",
    "ipython (>=9.7.0,<10.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "redis (>=7.0.1,<8.0.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "eventlet (>=0.40.3,<0.41.0)",
    "requests (>=2.32.5,<3.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "django-cleanup (>=9.0.0,<10.0.0)",
    "aiogram (>=3.22.0,<4.0.0)",
    "qrcode[pil] (>=8.2,<9.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)"
]

[tool.poetry]
name = "restoldpalace"
version = "0.1.0"
description = ""
authors = ["StreetShiffter <agwzdushaz@gmail.com>"]
readme = "README.md"
package-mode = false
